<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>samblitz — Fragancias</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="nav"></header>
  <main id="top">
    <section class="hero"><div class="hero-shade"></div><div class="hero-copy"><p>PRESENTACIÓN / SAMUEL</p><h1>samblitz</h1><span>Fragancias que dejan huella.</span></div></section>
    <section class="collection" id="productos"><p class="eyebrow">COLECCIÓN PRIVADA</p><h2>Descubre tu firma.</h2><div class="filter-bar"><label for="typeFilter">Filtrar por tipo</label><select id="typeFilter"><option value="all">Todas las lociones</option><option value="original">Original</option><option value="calidad">Calidad 1.1</option><option value="inspirada">Inspirada</option><option value="decants">Decants</option></select></div><div id="products" class="grid"></div></section>
    <section id="detail" class="detail" hidden></section>
  </main>
  <aside id="cart" class="cart" aria-label="Carrito"><div class="cart-head"><h2>Tu carrito</h2><button id="closeCart" aria-label="Cerrar carrito">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><strong id="cartTotal">$0</strong></div><button id="confirmOrder" class="gold full">Confirmar compra por WhatsApp</button></aside>
  <button id="cartToggle" class="cart-toggle">Carrito <span id="cartCount">0</span></button>
  <footer><div class="footer-line"></div><div class="footer-row"><span class="brand">samblitz</span><span>© 2026 samblitz Fragrances. Todos los derechos reservados.</span></div></footer>
  <script src="./app.js"></script>
</body>
</html>
